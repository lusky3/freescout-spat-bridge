# FreeScout <-> SportsPress Admin Tools: end-to-end test stack
# ==============================================================
# LOCAL / CI TESTING ONLY. Throwaway credentials throughout.
#
# A real WordPress + SportsPress + WooCommerce site (sportspress-sandbox's own
# Dockerfile) with the SPAT plugins bind-mounted in, and a real FreeScout
# running this module, on one bridge network. The module reaches WordPress at
# http://sportspress-test.
#
# Modeled on freescout-sportspress-e2e's compose file.
#
# Usage: ./run-e2e.sh   (see that script for the full orchestration)
#        docker compose -p spatbridge-e2e down -v   # tear down, with volumes
#
# Sibling checkouts default to ../../sportspress-sandbox and
# ../../SportsPress-Admin-Tools (relative to this file); override with
# SANDBOX_PATH and SPAT_PATH.

# A fixed project name, so this stack never collides with another compose
# project on the same machine (freescout-sportspress-e2e, the sandbox, the
# module's own docker/ dev harness).
name: spatbridge-e2e

services:
  # --- WordPress side ---
  sportspress-test:
    build:
      context: ${SANDBOX_PATH:-../../sportspress-sandbox}
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8094:80"
    volumes:
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-league-manager:/var/www/html/wp-content/plugins/sportspress-league-manager
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-admin-tools:/var/www/html/wp-content/plugins/sportspress-admin-tools
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-etransfer-automation:/var/www/html/wp-content/plugins/sportspress-etransfer-automation
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-events-manager:/var/www/html/wp-content/plugins/sportspress-events-manager
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-player-registration:/var/www/html/wp-content/plugins/sportspress-player-registration
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-player-tools:/var/www/html/wp-content/plugins/sportspress-player-tools
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-schedule-generator:/var/www/html/wp-content/plugins/sportspress-schedule-generator
      - ${SPAT_PATH:-../../SportsPress-Admin-Tools}/sportspress-score-sheets:/var/www/html/wp-content/plugins/sportspress-score-sheets
      - sp-baseline:/var/lib/baseline
      - sp-screenshots:/screenshots
      - sp-test-results:/test-results
    tmpfs:
      - /dev/shm:size=256m
    environment:
      - WORDPRESS_DB_HOST=localhost:/run/mysqld/mysqld.sock
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
      - SPORTSPRESS_SPORT=ice-hockey
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/wp-json/test/v1/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # --- FreeScout side ---
  freescout-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: freescout_root
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: freescout
    volumes:
      - freescout-db-data:/var/lib/mysql
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pfreescout_root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  freescout-app:
    # The module's own dev harness image; no copy kept here.
    build:
      context: ../docker/php
    volumes:
      # FreeScout core, cloned into ./freescout-core (gitignored) by run-e2e.sh.
      - ./freescout-core:/var/www/html
      # This repo is the module under test.
      - ..:/var/www/html/Modules/SpatBridge
      # Hide the repo's own harnesses from FreeScout: docker/ (the dev stack,
      # which holds its own FreeScout clone) and e2e/ (this stack, which holds
      # ./freescout-core). An empty named volume mounted over each path masks
      # it inside the container.
      - module-docker-dir-excluded:/var/www/html/Modules/SpatBridge/docker
      - module-e2e-dir-excluded:/var/www/html/Modules/SpatBridge/e2e
      # The tinker assertions, outside the module tree.
      - ./assert.php:/opt/spatbridge-e2e/assert.php:ro
    working_dir: /var/www/html
    # public/css/builds and public/js/builds hold FreeScout's minified asset
    # bundles, written on first page load; unwritable, the UI renders unstyled
    # and without JS for a human using this stack. public/modules takes the
    # module's symlink, which run-e2e.sh creates as www-data. The chown hands
    # back cache directories an older run-e2e.sh created as root.
    command: ["sh", "-c", "mkdir -p public/css/builds public/js/builds; chmod -R 777 storage bootstrap/cache public/css/builds public/js/builds public/modules 2>/dev/null; chown -R www-data:www-data storage/framework/cache; php-fpm"]
    depends_on:
      freescout-db:
        condition: service_healthy
    networks:
      e2e-net:
        # ../docker/nginx/default.conf passes PHP to app:9000.
        aliases:
          - app

  freescout-web:
    image: nginx:1.25-alpine
    volumes:
      - ./freescout-core:/var/www/html
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8095:80"
    depends_on:
      - freescout-app
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge

volumes:
  sp-baseline:
  sp-screenshots:
  sp-test-results:
  freescout-db-data:
  module-docker-dir-excluded:
  module-e2e-dir-excluded:

name: Changelog

# A PR that changes any shipped file (anything not export-ignore in
# .gitattributes) must add an entry under "## [Unreleased]" in CHANGELOG.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Full history: the guard diffs against the PR's base commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Require a changelog entry for shipped changes
        run: php scripts/release-guard pr "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
